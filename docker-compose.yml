x-common-variables: &env-files
  - .env

volumes:
  vendor:

services:
  mysql_db:
    image: mariadb:12.1
    env_file: *env-files
    restart: always
    volumes:
      - ./sql:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 15

  php-fpm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    volumes:
      - ./www:/var/www/html:ro
      - ./vendor:/var/www/html/vendor:ro
      - ./composer.json:/var/www/html/composer.json:ro
      - ./settings.php:/srv/pawn-docgen/settings.php:ro
      - ./generate:/srv/pawn-docgen/generate:ro
      - ./scripts:/srv/pawn-docgen/scripts:ro
    env_file: *env-files
    depends_on:
      mysql_db:
        condition: service_healthy
    
  og-gen:
    build: ./docker/og-gen
    restart: always
    env_file: *env-files
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1-alpine
    restart: always
    ports:
      - 83:80
    volumes:
      - ./www:/var/www/html:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
